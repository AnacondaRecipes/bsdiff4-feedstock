{% set name = "bsdiff4" %}
{% set version = "1.4.2" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: 3ffd4d8b2d5b9f0f1c427e4fb58512dc88a4cc807623b72bc0e95e0baa21c70b

build:
  number: 0
  entry_points:
    - bsdiff4 = bsdiff4.cli:main_bsdiff4
    - bspatch4 = bsdiff4.cli:main_bspatch4
  script: {{ PYTHON }} -m pip install . --no-deps --no-build-isolation --ignore-installed --no-cache-dir -vv

requirements:
  build:
    - {{ compiler('c') }}
    - {{ stdlib('c') }}
  host:
    - pip
    - python
    - setuptools
    - wheel
  run:
    - python

test:
  imports:
    - bsdiff4
    - bsdiff4.cli
    - bsdiff4.core
    - bsdiff4.format
  commands:
    - bsdiff4 --help
    - bspatch4 --help
    - pytest -vv --pyargs bsdiff4.tests
    - pip check
  requires:
    - pip
    - pytest

about:
  home: https://github.com/ilanschnell/bsdiff4
  license: BSD-2-Clause
  license_family: BSD
  license_file: LICENSE
  summary: binary diff and patch using the BSDIFF4-format
  dev_url: https://github.com/ilanschnell/bsdiff4
  doc_url: https://github.com/ilanschnell/bsdiff4
  description: |
    bsdiff4 is derived from bsdiff, a very simple Python extension module that
    allows Python to perform the same tasks as the bsdiff utility

extra:
  recipe-maintainers:
    - jjhelmus
