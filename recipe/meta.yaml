{% set name = "bsdiff4" %}
{% set version = "1.3.2" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: ed262caa697247e9af00af1076b5fce0b578a17b19d9bdbad30c110dd7660a8d

build:
  number: 0
  entry_points:
    - bsdiff4 = bsdiff4.cli:main_bsdiff4
    - bspatch4 = bsdiff4.cli:main_bspatch4
  script: {{ PYTHON }} -m pip install . --no-deps --no-build-isolation --ignore-installed --no-cache-dir -vv

requirements:
  build:
    - {{ compiler('c') }}
  host:
    - pip
    - python
    - setuptools
    - wheel
  run:
    - python

test:
  imports:
    - bsdiff4
  commands:
    - bsdiff4 --help
    - bspatch4 --help
    - pip check
  requires:
    - pip

about:
  home: https://github.com/ilanschnell/bsdiff4
  license: BSD-2-Clause
  license_family: BSD
  license_file: LICENSE
  summary: binary diff and patch using the BSDIFF4-format
  dev_url: https://github.com/ilanschnell/bsdiff4
  doc_url: https://github.com/ilanschnell/bsdiff4
  description: |
    bsdiff4 is derived from bsdiff, a very simple Python extension module that
    allows Python to perform the same tasks as the bsdiff utility











extra:
  recipe-maintainers:
    - jjhelmus
